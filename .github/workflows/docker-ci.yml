
name: Docker CI

on:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Backend lint
        working-directory: backend
        run: pnpm lint

      - name: Backend tests
        working-directory: backend
        run: pnpm test

      - name: Backend build
        working-directory: backend
        run: pnpm build

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t andrewpolishchuk91/multi-service-pet-backend:latest \
            -t andrewpolishchuk91/multi-service-pet-backend:${GITHUB_SHA} \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t andrewpolishchuk91/multi-service-pet-frontend:latest \
            -t andrewpolishchuk91/multi-service-pet-frontend:${GITHUB_SHA} \
            ./frontend

      - name: Push backend image
        run: |
          docker push andrewpolishchuk91/multi-service-pet-backend:latest
          docker push andrewpolishchuk91/multi-service-pet-backend:${GITHUB_SHA}

      - name: Push frontend image
        run: |
          docker push andrewpolishchuk91/multi-service-pet-frontend:latest
          docker push andrewpolishchuk91/multi-service-pet-frontend:${GITHUB_SHA}
