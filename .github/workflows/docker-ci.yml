name: Docker CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        run: |
          docker push andrewpolishchuk91/multi-service-pet-backend:latest
          docker push andrewpolishchuk91/multi-service-pet-backend:${GITHUB_SHA}

      - name: Push frontend image
        run: |
          docker push andrewpolishchuk91/multi-service-pet-frontend:latest
          docker push andrewpolishchuk91/multi-service-pet-frontend:${GITHUB_SHA}

      - name: Push backend image
        run: docker push andrewpolishchuk91/multi-service-pet-backend:latest

      - name: Push frontend image
        run: docker push andrewpolishchuk91/multi-service-pet-frontend:latest
    